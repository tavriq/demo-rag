name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # No API key and no model download: the suite runs on the 15-article fixture
      # with the hash embedder. The two tests that need the real index and the
      # e5-small model skip themselves (skipif in test_embeddings.py, test_examples.py).
      - run: python -m pytest -rs
